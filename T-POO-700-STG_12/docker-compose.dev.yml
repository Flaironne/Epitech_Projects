services:
  database:
    image: postgres:13
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - timemanager_network

  app:
    build: timemanager-backend
    container_name: timemanager
    environment:
      DATABASE_URL: "ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "4000:4000"
    networks:
      - timemanager_network
    depends_on:
      - database

  frontend:  #modifier url api dans vite.config.js par http://NOM_DU_BACKEND:4000
    build:
      context: timemanager-app
      dockerfile: Dockerfile
      target: dev
    container_name: vue_frontend_dev
    volumes:
      - ./timemanager-app:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5173}
    networks:
      - timemanager_network
    depends_on:
      - app

volumes:
  db_data:
    name: timemanager_db_data

networks:
  timemanager_network:
    driver: bridge
